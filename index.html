<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S. Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Exo+2:wght@300;400;600&display=swap');

  :root{
    --void:#0A0C10;
    --void-2:#0F1318;
    --core:#7FE8E0;
    --ring:#1B3A4B;
    --amber:#E8A05C;
    --text:#E4ECEC;
    --text-dim:#5C7378;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 30%, var(--void-2), var(--void) 70%);
    color:var(--text);
    font-family:'Exo 2', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    align-items:center;
    padding:5vh 5vw 4vh;
  }

  /* scanline / grid texture */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(127,232,224,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,232,224,0.025) 1px, transparent 1px);
    background-size:38px 38px;
    pointer-events:none;
    mask-image:radial-gradient(ellipse at 50% 40%, black 0%, transparent 70%);
  }

  .top-readout{
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--text-dim);
    text-transform:uppercase;
    z-index:2;
  }
  .top-readout .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--core);
    display:inline-block;
    margin-right:6px;
    box-shadow:0 0 6px var(--core);
    animation:blink 2.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:0.35}}

  .core-wrap{
    position:relative;
    width:min(46vh, 46vw);
    height:min(46vh, 46vw);
    margin:4vh 0 2vh;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  svg.rings{ position:absolute; inset:0; width:100%; height:100%; }
  .ring{
    fill:none;
    stroke:var(--ring);
    stroke-width:1;
    opacity:0.55;
    transform-origin:50% 50%;
  }
  .ring.outer{ stroke-dasharray:2 6; animation:spin 40s linear infinite; }
  .ring.mid{ stroke-dasharray:1 3; animation:spin 26s linear infinite reverse; }
  .ring.inner{ animation:spin 14s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .core{
    position:relative;
    width:34%; height:34%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #BFFFFA, var(--core) 45%, #1A3E3E 100%);
    box-shadow:
      0 0 30px 6px rgba(127,232,224,0.45),
      0 0 70px 20px rgba(127,232,224,0.15);
    transition:transform 60ms linear, box-shadow 120ms ease, background 300ms ease;
    z-index:2;
  }
  .core-wrap.listening .core{
    background:radial-gradient(circle at 40% 35%, #FFE8C8, var(--amber) 45%, #4a2f12 100%);
    box-shadow:
      0 0 36px 8px rgba(232,160,92,0.55),
      0 0 80px 24px rgba(232,160,92,0.18);
  }

  .amp-bars{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .amp-bars span{
    position:absolute;
    width:2px; background:var(--core);
    border-radius:2px;
    opacity:0.5;
    transform-origin:center;
  }

  .status-line{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--text-dim);
    text-align:center;
    min-height:18px;
    z-index:2;
  }
  .status-line.active{ color:var(--core); }

  .transcript{
    flex:1;
    width:100%;
    max-width:640px;
    margin-top:3vh;
    overflow-y:auto;
    z-index:2;
    padding-right:4px;
  }
  .transcript::-webkit-scrollbar{ width:4px; }
  .transcript::-webkit-scrollbar-thumb{ background:var(--ring); border-radius:2px; }

  .line{
    margin-bottom:14px;
    line-height:1.5;
    font-size:14.5px;
    animation:fadein 0.35s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .line .tag{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    margin-right:8px;
  }
  .line.user .tag{ color:var(--amber); }
  .line.ai .tag{ color:var(--core); }
  .line .body{ color:var(--text); }

  .controls{
    z-index:2;
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:2vh;
  }

  .mic-btn{
    width:64px; height:64px;
    border-radius:50%;
    border:1px solid var(--ring);
    background:rgba(127,232,224,0.04);
    color:var(--core);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s ease;
  }
  .mic-btn:hover{ background:rgba(127,232,224,0.1); }
  .mic-btn:focus-visible{ outline:2px solid var(--core); outline-offset:3px; }
  .mic-btn.active{
    border-color:var(--amber);
    color:var(--amber);
    background:rgba(232,160,92,0.08);
    box-shadow:0 0 18px rgba(232,160,92,0.3);
  }
  .mic-btn svg{ width:24px; height:24px; }

  .text-input-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    max-width:640px;
  }
  .text-input-row input{
    flex:1;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--ring);
    color:var(--text);
    font-family:'Exo 2', sans-serif;
    font-size:14px;
    padding:10px 14px;
    border-radius:6px;
    outline:none;
  }
  .text-input-row input:focus{ border-color:var(--core); }
  .text-input-row input::placeholder{ color:var(--text-dim); }

  .send-btn{
    background:transparent;
    border:1px solid var(--ring);
    color:var(--core);
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .send-btn:hover{ background:rgba(127,232,224,0.08); }
  .send-btn:focus-visible{ outline:2px solid var(--core); outline-offset:2px; }

  .voice-select{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .voice-select:focus-visible{ outline:1px solid var(--core); }

  .hint{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.08em;
    text-align:center;
    margin-top:10px;
    z-index:2;
  }

  @media (prefers-reduced-motion: reduce){
    .ring{ animation:none !important; }
    .status-dot{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="top-readout">
    <span><span class="status-dot"></span>SYSTEM ONLINE</span>
    <span id="clock">00:00:00</span>
  </div>

  <div class="core-wrap" id="coreWrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle class="ring outer" cx="100" cy="100" r="92"/>
      <circle class="ring mid" cx="100" cy="100" r="78"/>
      <circle class="ring inner" cx="100" cy="100" r="64"/>
    </svg>
    <div class="amp-bars" id="ampBars"></div>
    <div class="core" id="core"></div>
  </div>

  <div class="status-line" id="statusLine">STANDING BY</div>

  <div class="transcript" id="transcript"></div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" aria-label="Toggle voice input" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <select class="voice-select" id="voiceSelect" aria-label="Voice selection"></select>
  </div>

  <div class="text-input-row" style="margin-top:14px;">
    <input type="text" id="textInput" placeholder="Type a command...  e.g. what time is it, tell me a joke, status report" autocomplete="off">
    <button class="send-btn" id="sendBtn">SEND</button>
  </div>

  <div class="hint">Voice recognition requires Chrome, Edge, or Safari · mic permission needed</div>

</div>

<script>
(function(){
  const core = document.getElementById('core');
  const coreWrap = document.getElementById('coreWrap');
  const statusLine = document.getElementById('statusLine');
  const transcript = document.getElementById('transcript');
  const micBtn = document.getElementById('micBtn');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const voiceSelect = document.getElementById('voiceSelect');
  const ampBars = document.getElementById('ampBars');
  const clockEl = document.getElementById('clock');

  // ---- clock ----
  function tick(){
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString('en-US', {hour12:false});
  }
  tick(); setInterval(tick, 1000);

  // ---- amplitude bars (decorative ring of bars around core) ----
  const NUM_BARS = 28;
  const bars = [];
  for(let i=0;i<NUM_BARS;i++){
    const b = document.createElement('span');
    const angle = (i / NUM_BARS) * 360;
    b.style.height = '6px';
    b.style.transform = `rotate(${angle}deg) translateY(-78px)`;
    ampBars.appendChild(b);
    bars.push(b);
  }
  function setAmplitude(level){
    // level 0..1
    bars.forEach((b, i) => {
      const variance = 0.5 + Math.sin(i * 1.3 + Date.now()/180) * 0.5;
      const h = 4 + level * 26 * variance;
      b.style.height = h + 'px';
      b.style.opacity = 0.25 + level * 0.6;
    });
    core.style.transform = `scale(${1 + level * 0.06})`;
  }
  let idlePhase = 0;
  function idleAnimate(){
    idlePhase += 0.02;
    const breathe = (Math.sin(idlePhase) + 1) / 2 * 0.15;
    if(!recognitionActive) setAmplitude(breathe);
    requestAnimationFrame(idleAnimate);
  }
  idleAnimate();

  // ---- log lines ----
  function addLine(who, text){
    const line = document.createElement('div');
    line.className = 'line ' + who;
    const tag = who === 'user' ? 'YOU' : 'JARVIS';
    line.innerHTML = `<span class="tag">${tag}</span><span class="body"></span>`;
    line.querySelector('.body').textContent = text;
    transcript.appendChild(line);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function setStatus(text, active){
    statusLine.textContent = text;
    statusLine.classList.toggle('active', !!active);
  }

  // ---- speech synthesis ----
  let voices = [];
  function loadVoices(){
    voices = speechSynthesis.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = v.name + (v.lang ? ' (' + v.lang + ')' : '');
      voiceSelect.appendChild(opt);
    });
    // try to default to a deeper/male-leaning English voice for the JARVIS feel
    const preferred = voices.findIndex(v => /english/i.test(v.lang) && /male|daniel|arthur|david/i.test(v.name));
    if(preferred >= 0) voiceSelect.value = preferred;
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  let speakingAnimFrame = null;
  function animateSpeakingAmplitude(utterance){
    let t = 0;
    function frame(){
      t += 0.12;
      const level = 0.25 + Math.abs(Math.sin(t)) * 0.55;
      setAmplitude(level);
      if(speechSynthesis.speaking){
        speakingAnimFrame = requestAnimationFrame(frame);
      } else {
        setAmplitude(0.05);
      }
    }
    frame();
  }

  function speak(text){
    if(!('speechSynthesis' in window)){
      addLine('ai', text);
      return;
    }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const idx = voiceSelect.value;
    if(idx !== '' && voices[idx]) utter.voice = voices[idx];
    utter.rate = 1.0;
    utter.pitch = 0.95;
    utter.onstart = () => { setStatus('RESPONDING', true); animateSpeakingAmplitude(utter); };
    utter.onend = () => { setStatus('STANDING BY', false); };
    speechSynthesis.speak(utter);
  }

  // ---- simple local "brain" ----
  function respondTo(input){
    const q = input.toLowerCase().trim();
    let reply;

    if(/^(hi|hello|hey)\b/.test(q)){
      reply = "Good to hear from you. How can I help?";
    } else if(/what.*time/.test(q)){
      reply = "It's " + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) + ".";
    } else if(/what.*date|today.*date/.test(q)){
      reply = "Today is " + new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'}) + ".";
    } else if(/status report|system status/.test(q)){
      reply = "All systems nominal. Voice interface active, no pending alerts.";
    } else if(/joke/.test(q)){
      const jokes = [
        "I'd tell you a joke about UDP, but you might not get it.",
        "There are only two hard problems in computer science: cache invalidation, naming things, and off-by-one errors.",
        "I asked the cloud for a status update. It said partly mysterious, chance of latency."
      ];
      reply = jokes[Math.floor(Math.random()*jokes.length)];
    } else if(/who are you|your name/.test(q)){
      reply = "A voice interface built for you, in the spirit of Jarvis. I run in this browser tab, nothing more exotic than that.";
    } else if(/thank/.test(q)){
      reply = "Anytime.";
    } else {
      reply = "I heard: \"" + input + "\". I'm running on simple local logic right now, so I can't reason about that yet, but I can tell time, give a status report, or chat with you.";
    }
    addLine('ai', reply);
    speak(reply);
  }

  function handleSubmit(text){
    if(!text.trim()) return;
    addLine('user', text);
    respondTo(text);
    textInput.value = '';
  }

  sendBtn.addEventListener('click', () => handleSubmit(textInput.value));
  textInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleSubmit(textInput.value); });

  // ---- speech recognition ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognitionActive = false;

  if(SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      recognitionActive = true;
      coreWrap.classList.add('listening');
      micBtn.classList.add('active');
      micBtn.setAttribute('aria-pressed', 'true');
      setStatus('LISTENING', true);
    };

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const t = event.results[i][0].transcript;
        if(event.results[i].isFinal) final += t;
        else interim += t;
      }
      const level = Math.min(1, 0.3 + (interim.length % 20) / 20);
      setAmplitude(level);
      if(final) handleSubmit(final);
    };

    recognition.onerror = (e) => {
      setStatus('MIC ERROR: ' + e.error, false);
    };

    recognition.onend = () => {
      recognitionActive = false;
      coreWrap.classList.remove('listening');
      micBtn.classList.remove('active');
      micBtn.setAttribute('aria-pressed', 'false');
      if(statusLine.textContent === 'LISTENING') setStatus('STANDING BY', false);
    };

    micBtn.addEventListener('click', () => {
      if(recognitionActive){
        recognition.stop();
      } else {
        speechSynthesis.cancel();
        try{ recognition.start(); } catch(e){ /* already started */ }
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = 0.3;
    setStatus('VOICE INPUT UNSUPPORTED IN THIS BROWSER', false);
  }

  // welcome line
  setTimeout(() => {
    addLine('ai', "Interface online. Tap the mic and speak, or type a command below.");
  }, 400);

})();
</script>

</body>
</html>
